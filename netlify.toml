# Netlify: the pages are published as files; the API is one function.

[build]
  command = "npm run build:web"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The clock of the reminders: every 15 minutes (UTC). More often would keep the database awake all month.
[functions."reminders"]
  schedule = "*/15 * * * *"

# `force` so that no published file can ever answer in the API's place.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
